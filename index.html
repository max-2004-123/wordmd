<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordMD｜我的文件工作室</title>
<script src="vendor/marked.js"></script><script src="vendor/purify.js"></script><script src="vendor/turndown.js"></script><script src="vendor/gfm.js"></script>
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">W<span>WordMD <small>我的文件工作室</small></span></div><input id="name" aria-label="文件名稱" value="未命名文件"><span id="state" role="status">準備就緒</span><button id="save" class="primary">儲存文件</button></header>
<nav aria-label="檔案工具"><button id="new">＋ 新文件</button><button id="open">開啟檔案</button><span class="divider"></span><button id="md">匯出 Markdown</button><button id="print">列印 / PDF</button><span class="grow"></span><button id="sourceToggle">〈〉 Markdown 原始碼</button></nav>
<section id="ribbon" aria-label="文字格式工具列">
<div class="ribbon-controls"><button id="pinRibbon" type="button" aria-pressed="true" title="切換工具列固定">📌 固定</button><button id="toggleRibbon" type="button" aria-expanded="true" aria-controls="ribbonTools">收合 ▲</button></div>
<div id="ribbonTools">
<div class="group"><button data-cmd="undo" title="復原 Ctrl+Z">↶</button><button data-cmd="redo" title="重做 Ctrl+Y">↷</button></div>
<div class="group"><select id="block" aria-label="段落樣式"><option value="p">一般文字</option><option value="h1">標題 1</option><option value="h2">標題 2</option><option value="h3">標題 3</option><option value="blockquote">引言</option><option value="pre">程式碼區塊</option></select><select id="font" aria-label="字型"><option value="Microsoft JhengHei">微軟正黑體</option><option value="PMingLiU">新細明體</option><option value="Arial">Arial</option><option value="Times New Roman">Times New Roman</option></select><button id="sizeDown" type="button" aria-label="縮小字級" title="縮小字級">−</button><select id="size" aria-label="字級"><option value="2">10 pt</option><option value="3" selected>12 pt</option><option value="4">14 pt</option><option value="5">18 pt</option><option value="6">24 pt</option><option value="7">36 pt</option></select><button id="sizeUp" type="button" aria-label="放大字級" title="放大字級">＋</button></div>
<div class="group"><button data-cmd="bold" title="粗體 Ctrl+B"><b>B</b></button><button data-cmd="italic" title="斜體 Ctrl+I"><i>I</i></button><button data-cmd="underline" title="底線 Ctrl+U"><u>U</u></button><button data-cmd="strikeThrough" title="刪除線"><s>S</s></button><label title="文字顏色">A <input id="color" type="color" value="#24304a" aria-label="文字顏色"></label><button data-cmd="hiliteColor" data-value="#fff2a8" title="螢光標記">標記</button></div>
<div class="group"><button data-cmd="justifyLeft" title="靠左">靠左</button><button data-cmd="justifyCenter" title="置中">置中</button><button data-cmd="justifyRight" title="靠右">靠右</button><button data-cmd="insertUnorderedList" title="項目符號">• 清單</button><button data-cmd="insertOrderedList" title="編號清單">1. 清單</button></div>
<div class="group"><button id="link">連結</button><button id="table">表格</button><button id="image">圖片</button><button data-cmd="removeFormat">清除格式</button></div>
</div></section>
<main><aside><div class="eyebrow">DOCUMENT OUTLINE</div><h3>文件大綱</h3><div id="outline"></div><div class="tip">直接點選紙張開始編輯。<br>選取文字後，使用上方工具列調整格式。<br><br>Ctrl + S 儲存完整格式<br>Ctrl + B 粗體<br>Ctrl + Z 復原<br><br>文件在本機處理，不會上傳。</div></aside><div class="workspace"><div class="paper-label">編輯模式 <span>所見即所得 · A4 寬度</span></div><article id="editor" contenteditable="true" spellcheck="false" role="textbox" aria-label="文件編輯區" aria-multiline="true"></article></div><section id="sourcePanel" hidden><h3>Markdown 原始碼</h3><p>套用會以 Markdown 重建內容，字型、顏色、對齊等格式可能消失。</p><textarea id="source" aria-label="Markdown 原始碼"></textarea><button id="applySource" class="primary">套用至文件</button><button id="cancelSource">關閉</button></section></main>
<footer><span id="count"></span><span id="draft">本機草稿</span><span>HTML 保留完整格式 · Markdown 適合純文字交流</span></footer>
<input id="file" type="file" accept=".md,.markdown,.txt,.html,.htm" hidden><input id="picture" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<script src="app.js"></script></body></html>
